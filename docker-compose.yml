# Local/integrated run: one container, data and models in named volumes.
# Production (Traefik labels, SSO) is phase 5; this file is the base for it.
services:
  api:
    build: .
    image: innesto:local
    ports:
      - "8000:8000"
    volumes:
      - innesto-data:/data
      - innesto-models:/models
    environment:
      INNESTO_TRANSLATION_ENGINE: ct2
    restart: unless-stopped

volumes:
  innesto-data:
  innesto-models:
